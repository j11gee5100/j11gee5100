services:
  redis:
    image: redis:7-alpine
    container_name: opspaw-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: opspaw/inference-env-platform:latest
    container_name: opspaw-api
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://opspaw:opspaw@host.docker.internal:3306/opspaw?charset=utf8mb4}
      REDIS_URL: ${REDIS_URL:-redis://opspaw-redis:6379/0}
      DELIVERY_BUNDLE_ARTIFACT_ROOT: /data/delivery-bundles
      MCP_ALLOWED_PACKAGE_ROOTS: /data/env-packages,/mnt/env-packages,/nas/inference-packages
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - env_packages:/data/env-packages
      - delivery_bundles:/data/delivery-bundles
      # 生产上线解耦：业务程序包外挂，依赖镜像不变时无需重构建镜像。
      - ./current/app:/app/app:ro
      - ./current/alembic:/app/alembic:ro
      - ./current/alembic.ini:/app/alembic.ini:ro
      - ./current/docker/api/uwsgi.ini:/app/docker/api/uwsgi.ini:ro
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "18080:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: opspaw/inference-env-platform-nginx:latest
    container_name: opspaw-nginx
    ports:
      - "18081:80"
    volumes:
      # 前端静态文件外挂，前端改动无需重构建 nginx 镜像。
      - ./current/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  env_packages:
  delivery_bundles:
