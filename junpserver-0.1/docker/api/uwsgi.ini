[uwsgi]
chdir = /app
module = app.api.wsgi:application
master = true
processes = 8
threads = 1
enable-threads = true
http-socket = 0.0.0.0:8000
vacuum = true
die-on-term = true
need-app = true
lazy-apps = true
single-interpreter = true
buffer-size = 65535
harakiri = 300
http-timeout = 300
socket-timeout = 300
max-requests = 5000
max-requests-delta = 500
reload-on-rss = 512
thunder-lock = true
uid = app
gid = app
log-4xx = true
log-5xx = true
disable-logging = false
